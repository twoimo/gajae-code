name: Port memory successor

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  issues: write

jobs:
  port:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'successor/memory-guard-current'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check one-shot trigger
        id: gate
        shell: bash
        run: |
          if [ -f .github/trigger/port-memory-successor ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply closed-PR net diff to current dev
        id: apply
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        shell: bash
        run: |
          git config user.name 'twoimo'
          git config user.email '32544727+twoimo@users.noreply.github.com'
          git fetch --no-tags origin backup/memory-guard-426ca8d1
          git diff --binary 5cd97b6611a56b4df75b9151e9f28691c28d7f98..origin/backup/memory-guard-426ca8d1 > /tmp/memory-successor.patch
          if ! git apply --3way --index /tmp/memory-successor.patch; then
            git diff --name-only --diff-filter=U | sort > /tmp/memory-conflicts.txt
            exit 1
          fi

      - name: Report application conflicts
        if: steps.gate.outputs.run == 'true' && steps.apply.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const conflicts = fs.existsSync('/tmp/memory-conflicts.txt')
              ? fs.readFileSync('/tmp/memory-conflicts.txt', 'utf8').trim()
              : '(patch failed before conflict enumeration)';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `MEMORY_SUCCESSOR_CONFLICTS\n\n${conflicts}`,
            });

      - name: Stop after conflict report
        if: steps.gate.outputs.run == 'true' && steps.apply.outcome == 'failure'
        run: exit 1

      - name: Commit current-dev port
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          git rm .github/trigger/port-memory-successor
          git add -A
          git commit -m 'feat(coding-agent): port memory pressure observability to current dev'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Report success
        if: steps.gate.outputs.run == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'MEMORY_SUCCESSOR_PORTED',
            });
