name: Repair Telegram successor

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'successor/telegram-tool-activity-clean'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: successor/telegram-tool-activity-clean
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild reviewed net diff on current upstream dev
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          git config user.name 'twoimo'
          git config user.email '32544727+twoimo@users.noreply.github.com'
          git remote add upstream https://github.com/Yeachan-Heo/gajae-code.git || true
          git fetch --no-tags upstream dev
          git fetch --no-tags origin successor/telegram-tool-activity-clean
          SOURCE=origin/successor/telegram-tool-activity-clean
          BASE=10a32cfdbe971799581533a0e583fdf77e4c7d2c
          git diff --binary "$BASE".."$SOURCE" -- . ':(exclude).github/workflows/telegram-successor-sync.yml' > /tmp/telegram-successor.patch
          git reset --hard upstream/dev
          if ! git apply --3way --index /tmp/telegram-successor.patch; then
            git diff --name-only --diff-filter=U | sort > /tmp/telegram-conflicts.txt
            if [ "$(cat /tmp/telegram-conflicts.txt)" = "packages/coding-agent/src/sdk/bus/index.ts" ]; then
              python3 - <<'PY'
          from pathlib import Path
          path = Path('packages/coding-agent/src/sdk/bus/index.ts')
          text = path.read_text()
          start = text.find('<<<<<<< ours\n')
          if start < 0:
              raise SystemExit('expected Telegram shutdown conflict marker missing')
          separator = text.find('=======\n', start)
          end = text.find('>>>>>>> theirs\n', separator)
          if separator < 0 or end < 0:
              raise SystemExit('malformed Telegram shutdown conflict')
          ours = text[start + len('<<<<<<< ours\n'):separator]
          theirs = text[separator + len('=======\n'):end]
          if 'terminalizeInFlightTools(rt, id, "unknown")' not in ours:
              raise SystemExit('upstream shutdown settlement anchor changed')
          if 'terminalizeInFlightTools(rt, id, "cancelled")' not in theirs:
              raise SystemExit('successor shutdown settlement anchor changed')
          resolved = ours.replace(
              'terminalizeInFlightTools(rt, id, "unknown")',
              'terminalizeInFlightTools(rt, id, "cancelled")',
              1,
          )
          text = text[:start] + resolved + text[end + len('>>>>>>> theirs\n'):]
          path.write_text(text)
          PY
              git add packages/coding-agent/src/sdk/bus/index.ts
              test -z "$(git diff --name-only --diff-filter=U)"
            else
              git diff --cc > /tmp/telegram-conflict-diff.txt
              exit 1
            fi
          fi

      - name: Report application conflicts
        if: steps.apply.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const paths = fs.existsSync('/tmp/telegram-conflicts.txt')
              ? fs.readFileSync('/tmp/telegram-conflicts.txt', 'utf8').trim()
              : '(patch failed before conflict enumeration)';
            const diff = fs.existsSync('/tmp/telegram-conflict-diff.txt')
              ? fs.readFileSync('/tmp/telegram-conflict-diff.txt', 'utf8').slice(0, 45000)
              : '';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `TELEGRAM_SUCCESSOR_CONFLICTS\n\n${paths}\n\n\`\`\`diff\n${diff}\n\`\`\``,
            });

      - name: Stop after conflict report
        if: steps.apply.outcome == 'failure'
        run: exit 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install and format
        run: |
          bun install --frozen-lockfile
          bunx biome check --write \
            packages/coding-agent/src/sdk/bus/telegram-daemon.ts \
            packages/coding-agent/src/sdk/bus/index.ts \
            packages/coding-agent/test/notifications-telegram-daemon.test.ts
          cargo fmt --all
          git add -A

      - name: Run rejected-terminal regression
        run: bun test --timeout 30000 packages/coding-agent/test/notifications-telegram-daemon.test.ts --test-name-pattern 'terminal submission rejection'

      - name: Run Telegram lifecycle boundary
        run: |
          bun test --timeout 30000 \
            packages/coding-agent/test/notifications-telegram-daemon.test.ts \
            packages/coding-agent/test/notifications-tool-activity.test.ts \
            packages/coding-agent/test/sdk-host.test.ts \
            packages/coding-agent/test/sdk-host-wiring.test.ts
          bun test --timeout 30000 scripts/telegram-daemon-generation-guard.test.ts
          bun scripts/telegram-daemon-generation-guard.ts --validate-current-tree
          bun --cwd=packages/coding-agent run check

      - name: Publish verified current-dev successor
        shell: bash
        run: |
          rm -f .github/workflows/telegram-successor-sync.yml
          git add -A
          git commit -m 'fix(notifications): make Telegram tool activity opt-in'
          git push --force origin HEAD:successor/telegram-tool-activity-clean
          git push --force origin HEAD:verified/telegram-tool-activity-terminal-rejection

      - name: Report success
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'TELEGRAM_SUCCESSOR_VERIFIED',
            });
