name: Repair Telegram successor

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'successor/telegram-tool-activity-clean'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: successor/telegram-tool-activity-clean
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bunx biome check --write packages/coding-agent/test/notifications-telegram-daemon.test.ts
      - run: bun test --timeout 30000 packages/coding-agent/test/notifications-telegram-daemon.test.ts --test-name-pattern 'terminal submission rejection'
      - run: bun --cwd=packages/coding-agent run check
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'twoimo'
          git config user.email '32544727+twoimo@users.noreply.github.com'
          git add packages/coding-agent/test/notifications-telegram-daemon.test.ts
          git commit -m 'test(notifications): format rejected terminal regression'
          git push origin HEAD:successor/telegram-tool-activity-clean
