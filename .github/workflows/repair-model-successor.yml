name: Repair model preset successor

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'successor/model-preset-default-action-clean'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: successor/model-preset-default-action-clean
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Repair callback return types
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('packages/coding-agent/test/model-selector-profiles-redteam.test.ts')
          text = path.read_text()
          text = text.replace(
              'const renameSelector = createSelector(selection => renamed.push(selection));',
              'const renameSelector = createSelector(selection => {\n\t\t\trenamed.push(selection);\n\t\t});',
          )
          text = text.replace(
              'const deleteSelector = createSelector(selection => deleted.push(selection));',
              'const deleteSelector = createSelector(selection => {\n\t\t\tdeleted.push(selection);\n\t\t});',
          )
          path.write_text(text)
          PY
          bunx biome check --write packages/coding-agent/test/model-selector-profiles-redteam.test.ts
      - run: |
          bun test --timeout 30000 \
            packages/coding-agent/test/model-selector-profiles.test.ts \
            packages/coding-agent/test/model-selector-profiles-redteam.test.ts \
            packages/coding-agent/test/model-preset-landing-redteam-qa.test.ts \
            packages/coding-agent/test/cli-args-mpreset.test.ts
      - run: bun --cwd=packages/coding-agent run check
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'twoimo'
          git config user.email '32544727+twoimo@users.noreply.github.com'
          git add packages/coding-agent/test/model-selector-profiles-redteam.test.ts
          git commit -m 'test(coding-agent): preserve void preset callbacks'
          git push origin HEAD:successor/model-preset-default-action-clean
