name: Repair model preset successor

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'successor/model-preset-default-action-current'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: successor/model-preset-default-action-current
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check one-shot trigger
        id: gate
        shell: bash
        run: |
          if [ -f .github/trigger/verify-model-preset-current ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild minimal diff on current dev
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name 'twoimo'
          git config user.email '32544727+twoimo@users.noreply.github.com'
          git remote add upstream https://github.com/Yeachan-Heo/gajae-code.git || true
          git fetch --no-tags upstream dev
          git reset --hard upstream/dev
          git cherry-pick fcd0a24e98e711bf38ffd5b93f497029d48ee0f1

      - uses: oven-sh/setup-bun@v2
        if: steps.gate.outputs.run == 'true'
        with:
          bun-version: '1.3.14'

      - name: Normalize callback return types
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('packages/coding-agent/test/model-selector-profiles-redteam.test.ts')
          text = path.read_text()
          text = text.replace(
              'const select = (selection: ModelSelectorSelection) => selections.push(selection);',
              'const select = (selection: ModelSelectorSelection) => {\n\t\t\tselections.push(selection);\n\t\t};',
          )
          text = text.replace(
              'const renameSelector = createSelector(selection => renamed.push(selection));',
              'const renameSelector = createSelector(selection => {\n\t\t\trenamed.push(selection);\n\t\t});',
          )
          text = text.replace(
              'const deleteSelector = createSelector(selection => deleted.push(selection));',
              'const deleteSelector = createSelector(selection => {\n\t\t\tdeleted.push(selection);\n\t\t});',
          )
          path.write_text(text)
          PY
          bunx biome check --write \
            packages/coding-agent/src/modes/components/model-selector.ts \
            packages/coding-agent/test/model-selector-profiles-redteam.test.ts

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: bun install --frozen-lockfile

      - name: Run profile controller regressions
        if: steps.gate.outputs.run == 'true'
        run: bun test --timeout 30000 packages/coding-agent/test/model-selector-profiles.test.ts

      - name: Run profile red-team regressions
        if: steps.gate.outputs.run == 'true'
        run: bun test --timeout 30000 packages/coding-agent/test/model-selector-profiles-redteam.test.ts

      - name: Run preset landing regressions
        if: steps.gate.outputs.run == 'true'
        run: bun test --timeout 30000 packages/coding-agent/test/model-preset-landing-redteam-qa.test.ts

      - name: Run mpreset CLI regressions
        if: steps.gate.outputs.run == 'true'
        run: bun test --timeout 30000 packages/coding-agent/test/cli-args-mpreset.test.ts

      - name: Run coding-agent check
        if: steps.gate.outputs.run == 'true'
        run: bun --cwd=packages/coding-agent run check

      - name: Publish verified clean successor
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          git reset --soft upstream/dev
          git add \
            packages/coding-agent/CHANGELOG.md \
            packages/coding-agent/src/modes/components/model-selector.ts \
            packages/coding-agent/test/model-selector-profiles-redteam.test.ts
          git commit -m 'feat(coding-agent): default preset selection to persistence'
          git push --force origin HEAD:successor/model-preset-default-action-current
