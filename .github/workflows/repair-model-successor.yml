name: Repair model preset successor

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'successor/model-preset-default-action-current'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: successor/model-preset-default-action-current
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check one-shot trigger
        id: gate
        shell: bash
        run: |
          if [ -f .github/trigger/verify-model-preset-current ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild minimal diff on current dev
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name 'twoimo'
          git config user.email '32544727+twoimo@users.noreply.github.com'
          git remote add upstream https://github.com/Yeachan-Heo/gajae-code.git || true
          git fetch --no-tags upstream dev
          git reset --hard upstream/dev
          git cherry-pick fcd0a24e98e711bf38ffd5b93f497029d48ee0f1

      - uses: oven-sh/setup-bun@v2
        if: steps.gate.outputs.run == 'true'
        with:
          bun-version: '1.3.14'

      - name: Normalize callback return types
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('packages/coding-agent/test/model-selector-profiles-redteam.test.ts')
          text = path.read_text()
          text = text.replace(
              'const select = (selection: ModelSelectorSelection) => selections.push(selection);',
              'const select = (selection: ModelSelectorSelection): void => {\n\t\t\tselections.push(selection);\n\t\t};',
          )
          text = text.replace(
              'const renameSelector = createSelector(selection => renamed.push(selection));',
              'const renameSelector = createSelector(selection => {\n\t\t\trenamed.push(selection);\n\t\t});',
          )
          text = text.replace(
              'const deleteSelector = createSelector(selection => deleted.push(selection));',
              'const deleteSelector = createSelector(selection => {\n\t\t\tdeleted.push(selection);\n\t\t});',
          )
          path.write_text(text)
          PY
          bunx biome check --write \
            packages/coding-agent/src/modes/components/model-selector.ts \
            packages/coding-agent/test/model-selector-profiles-redteam.test.ts

      - name: Install dependencies
        id: install
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bun install --frozen-lockfile 2>&1 | tee /tmp/model-install.log

      - name: Build native addon required by selector tests
        id: native
        if: steps.gate.outputs.run == 'true' && steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bun --cwd=packages/natives run build 2>&1 | tee /tmp/model-native.log

      - name: Run profile controller regressions
        id: controller
        if: steps.gate.outputs.run == 'true' && steps.native.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bun test --timeout 30000 packages/coding-agent/test/model-selector-profiles.test.ts 2>&1 | tee /tmp/model-controller.log

      - name: Run profile red-team regressions
        id: redteam
        if: steps.gate.outputs.run == 'true' && steps.controller.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bun test --timeout 30000 packages/coding-agent/test/model-selector-profiles-redteam.test.ts 2>&1 | tee /tmp/model-redteam.log

      - name: Run remaining preset regressions
        id: remaining
        if: steps.gate.outputs.run == 'true' && steps.redteam.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bun test --timeout 30000 \
            packages/coding-agent/test/model-preset-landing-redteam-qa.test.ts \
            packages/coding-agent/test/cli-args-mpreset.test.ts 2>&1 | tee /tmp/model-remaining.log

      - name: Run coding-agent check
        id: package
        if: steps.gate.outputs.run == 'true' && steps.remaining.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bun --cwd=packages/coding-agent run check 2>&1 | tee /tmp/model-package.log

      - name: Publish verified clean successor
        if: steps.gate.outputs.run == 'true' && steps.install.outcome == 'success' && steps.native.outcome == 'success' && steps.controller.outcome == 'success' && steps.redteam.outcome == 'success' && steps.remaining.outcome == 'success' && steps.package.outcome == 'success'
        shell: bash
        run: |
          git reset --soft upstream/dev
          git rm -f .github/trigger/verify-model-preset-current
          git add \
            packages/coding-agent/CHANGELOG.md \
            packages/coding-agent/src/modes/components/model-selector.ts \
            packages/coding-agent/test/model-selector-profiles-redteam.test.ts
          git commit -m 'feat(coding-agent): default preset selection to persistence'
          git push --force origin HEAD:successor/model-preset-default-action-current
          git push --force origin HEAD:verified/model-preset-default-action

      - name: Report result
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/github-script@v7
        env:
          INSTALL: ${{ steps.install.outcome }}
          NATIVE: ${{ steps.native.outcome }}
          CONTROLLER: ${{ steps.controller.outcome }}
          REDTEAM: ${{ steps.redteam.outcome }}
          REMAINING: ${{ steps.remaining.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
        with:
          script: |
            const fs = require('fs');
            const ok = [process.env.INSTALL, process.env.NATIVE, process.env.CONTROLLER, process.env.REDTEAM, process.env.REMAINING, process.env.PACKAGE].every(v => v === 'success');
            const logs = ['/tmp/model-install.log', '/tmp/model-native.log', '/tmp/model-controller.log', '/tmp/model-redteam.log', '/tmp/model-remaining.log', '/tmp/model-package.log']
              .filter(path => fs.existsSync(path))
              .flatMap(path => fs.readFileSync(path, 'utf8').split('\n'))
              .slice(-120)
              .join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: ok ? 'MODEL_SUCCESSOR_VERIFIED' : `MODEL_SUCCESSOR_FAILED\n\ninstall=${process.env.INSTALL}\nnative=${process.env.NATIVE}\ncontroller=${process.env.CONTROLLER}\nredteam=${process.env.REDTEAM}\nremaining=${process.env.REMAINING}\npackage=${process.env.PACKAGE}\n\n\`\`\`text\n${logs.slice(0, 50000)}\n\`\`\``,
            });
            if (!ok) core.setFailed('Model successor verification failed');
