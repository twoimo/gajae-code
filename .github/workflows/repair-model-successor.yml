name: Verify successor branches

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  verify:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(
        fromJSON('["successor/model-preset-default-action-current","successor/welcome-composer-gutter-current-v2","successor/malformed-settings-recovery-current","fix/memory-guard-domain-scheduler"]'),
        github.event.pull_request.head.ref
      )
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Check out trusted verification source
        uses: actions/checkout@v4
        with:
          ref: main
          path: repair-source

      - name: Check out successor target
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          path: work
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check one-shot trigger
        id: gate
        working-directory: work
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          case "$TARGET_BRANCH" in
            successor/model-preset-default-action-current)
              trigger=.github/trigger/verify-model-preset-current
              ;;
            successor/welcome-composer-gutter-current-v2)
              trigger=.github/trigger/rebuild-welcome-successor
              ;;
            successor/malformed-settings-recovery-current)
              trigger=.github/trigger/rebuild-settings-successor
              ;;
            fix/memory-guard-domain-scheduler)
              trigger=.github/trigger/memory-clean-port
              ;;
            *)
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          if [[ -f "$trigger" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.gate.outputs.run == 'true'
        with:
          bun-version: '1.3.14'

      - name: Rebuild, verify, and publish immutable successor
        id: verify
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        working-directory: work
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -o pipefail
          bash ../repair-source/.github/repair/run-successor-verification.sh \
            "$TARGET_BRANCH" ../repair-source 2>&1 | tee /tmp/successor-verification.log

      - name: Report verification result
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.verify.outcome }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        with:
          script: |
            const fs = require('fs');
            const marker = fs.existsSync('/tmp/successor-result')
              ? fs.readFileSync('/tmp/successor-result', 'utf8').trim()
              : '';
            const log = fs.existsSync('/tmp/successor-verification.log')
              ? fs.readFileSync('/tmp/successor-verification.log', 'utf8').split('\n').slice(-160).join('\n')
              : '(verification log unavailable)';
            const ok = process.env.OUTCOME === 'success' && marker.endsWith('_VERIFIED');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: ok
                ? marker
                : `SUCCESSOR_VERIFICATION_FAILED\n\nbranch=${process.env.TARGET_BRANCH}\noutcome=${process.env.OUTCOME}\nmarker=${marker || '(none)'}\n\n\`\`\`text\n${log.slice(0, 50000)}\n\`\`\``,
            });

      - name: Fail after diagnostic publication
        if: steps.gate.outputs.run == 'true' && steps.verify.outcome != 'success'
        run: exit 1
