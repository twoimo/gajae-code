name: Rebuild Telegram successor on current dev

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  issues: write

jobs:
  rebuild:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/telegram-tool-activity-terminal-rejection'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check one-shot trigger
        id: gate
        shell: bash
        run: |
          if [ -f .github/trigger/telegram-clean-rebuild ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reset target to the live upstream dev baseline
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "twoimo"
          git config user.email "32544727+twoimo@users.noreply.github.com"
          git remote add upstream https://github.com/Yeachan-Heo/gajae-code.git || true
          git fetch --no-tags upstream dev
          git reset --hard upstream/dev
          git fetch --no-tags origin backup/telegram-tool-activity-103337

      - name: Apply exact net feature diff onto current dev
        if: steps.gate.outputs.run == 'true'
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          git diff --binary 7c3f5907b5fbd42d573fe3a2186858b7245c3e77..origin/backup/telegram-tool-activity-103337 > /tmp/telegram-successor.patch
          if ! git apply --3way --index /tmp/telegram-successor.patch; then
            git diff --name-only --diff-filter=U > /tmp/telegram-conflicts.txt
            exit 1
          fi

      - name: Report patch conflicts
        if: steps.gate.outputs.run == 'true' && steps.apply.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const paths = fs.existsSync('/tmp/telegram-conflicts.txt')
              ? fs.readFileSync('/tmp/telegram-conflicts.txt', 'utf8').trim()
              : '(patch failed before conflict enumeration)';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `TELEGRAM_REBUILD_FAILED\n\n${paths}`,
            });
            core.setFailed('Telegram patch application failed');

      - name: Stop after conflict report
        if: steps.gate.outputs.run == 'true' && steps.apply.outcome == 'failure'
        run: exit 1

      - uses: oven-sh/setup-bun@v2
        if: steps.gate.outputs.run == 'true'

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: bun install --frozen-lockfile

      - name: Format changed TypeScript and Rust files
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          changed_ts=$(git diff --cached --name-only -- '*.ts' '*.tsx')
          if [ -n "$changed_ts" ]; then
            bunx biome check --write $changed_ts
            git add $changed_ts
          fi
          cargo fmt --all
          git add -A

      - name: Publish product commit before verification
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          git add -A
          git commit -m "fix(notifications): retire rejected legacy tool terminals"
          git push --force origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Run focused rejected-terminal regression
        id: focused
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: bun test --timeout 30000 packages/coding-agent/test/notifications-telegram-daemon.test.ts --test-name-pattern "terminal submission rejection"

      - name: Run Telegram lifecycle suites
        id: lifecycle
        if: steps.gate.outputs.run == 'true' && steps.focused.outcome == 'success'
        continue-on-error: true
        run: |
          bun test --timeout 30000 \
            packages/coding-agent/test/notifications-telegram-daemon.test.ts \
            packages/coding-agent/test/notifications-tool-activity.test.ts \
            packages/coding-agent/test/sdk-host.test.ts
          bun test --timeout 30000 scripts/telegram-daemon-generation-guard.test.ts
          bun scripts/telegram-daemon-generation-guard.ts --validate-current-tree

      - name: Run package check
        id: package
        if: steps.gate.outputs.run == 'true' && steps.focused.outcome == 'success' && steps.lifecycle.outcome == 'success'
        continue-on-error: true
        run: bun --cwd=packages/coding-agent run check

      - name: Publish verification receipt and immutable verified branch
        if: steps.gate.outputs.run == 'true' && steps.focused.outcome == 'success' && steps.lifecycle.outcome == 'success' && steps.package.outcome == 'success'
        shell: bash
        run: |
          git commit --allow-empty -m "test(notifications): verify rejected terminal successor"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
          git push --force origin HEAD:verified/telegram-tool-activity-terminal-rejection

      - name: Report verification result
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/github-script@v7
        env:
          FOCUSED: ${{ steps.focused.outcome }}
          LIFECYCLE: ${{ steps.lifecycle.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
        with:
          script: |
            const ok = process.env.FOCUSED === 'success' && process.env.LIFECYCLE === 'success' && process.env.PACKAGE === 'success';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: ok ? 'TELEGRAM_REBUILD_OK' : `TELEGRAM_REBUILD_FAILED\n\nfocused=${process.env.FOCUSED}\nlifecycle=${process.env.LIFECYCLE}\npackage=${process.env.PACKAGE}`,
            });
            if (!ok) core.setFailed('Telegram verification failed');
