name: Diagnose successor check

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.head.ref == 'successor/telegram-tool-activity-clean' || github.event.pull_request.head.ref == 'successor/model-preset-default-action-clean')
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      - name: Capture full check output
        id: check
        continue-on-error: true
        shell: bash
        run: |
          set +e
          bun run ci:check:full > /tmp/successor-check.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish diagnostic
        uses: actions/github-script@v7
        env:
          STATUS: ${{ steps.check.outputs.status }}
        with:
          script: |
            const fs = require('fs');
            const lines = fs.readFileSync('/tmp/successor-check.log', 'utf8').split('\n');
            const tail = lines.slice(-180).join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `SUCCESSOR_CHECK_DIAGNOSTIC status=${process.env.STATUS}\n\n\`\`\`text\n${tail}\n\`\`\``,
            });
            if (process.env.STATUS !== '0') core.setFailed('Successor check failed');
